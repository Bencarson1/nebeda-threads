name: Frontend quality checks

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/nebeda
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/nebeda/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
